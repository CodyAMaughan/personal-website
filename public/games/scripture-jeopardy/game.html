<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctrinal Mastery Jeopardy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --jeopardy-blue: #060ce9;
    --jeopardy-blue-dark: #03078a;
    --jeopardy-gold: #ffcc00;
    --jeopardy-cream: #f6e9c5;
    --used: #0a0a3a;
  }

  body {
    background: var(--jeopardy-blue);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: white;
    height: 100vh;
    padding: 10px 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ============ HEADER ============ */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-bottom: 10px;
    max-width: 1400px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    flex-shrink: 0;
  }

  h1 {
    text-align: center;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(1.4em, 2.6vw, 2em);
    text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,0.3);
    letter-spacing: 2px;
    color: var(--jeopardy-gold);
    line-height: 1.05;
  }

  .team {
    background: var(--jeopardy-blue-dark);
    border: 2px solid var(--jeopardy-gold);
    border-radius: 6px;
    padding: 6px 10px;
    text-align: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.4);
  }
  .team-name {
    font-size: 0.78em;
    color: #fff;
    font-weight: bold;
    cursor: text;
    border-bottom: 1px dashed transparent;
  }
  .team-name:hover { border-bottom-color: rgba(255,255,255,0.3); }
  .team-score {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 1.5em;
    color: var(--jeopardy-gold);
    text-shadow: 2px 2px 0 #000;
    margin: 2px 0;
    letter-spacing: 1px;
  }
  .team-score.negative { color: #ff6b6b; }
  .team-buttons {
    display: flex;
    gap: 4px;
    justify-content: center;
  }
  .team-buttons button {
    background: rgba(255,204,0,0.15);
    color: var(--jeopardy-gold);
    border: 1px solid var(--jeopardy-gold);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 0.75em;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .team-buttons button:hover { background: rgba(255,204,0,0.3); }

  /* ============ BOARD ============ */
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: auto repeat(5, 1fr);
    gap: 4px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 6px;
    background: #000;
    border: 3px solid var(--jeopardy-gold);
    border-radius: 4px;
    box-shadow: 0 0 24px rgba(0,0,0,0.6);
    flex: 1 1 auto;
    min-height: 0;
  }

  .category {
    background: var(--jeopardy-blue);
    border: 2px solid #000;
    color: white;
    padding: 8px 6px;
    text-align: center;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(0.75em, 1.05vw, 1em);
    text-transform: uppercase;
    text-shadow: 2px 2px 0 #000;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    letter-spacing: 0.5px;
    min-height: 0;
  }

  .clue-cell {
    background: var(--jeopardy-blue);
    border: 2px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.12s, background 0.2s;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(1.1em, 2.2vw, 1.9em);
    color: var(--jeopardy-gold);
    text-shadow: 3px 3px 0 #000;
    user-select: none;
    min-height: 0;
  }
  .clue-cell:hover {
    transform: scale(1.03);
    background: #1018ff;
  }
  .clue-cell:active { transform: scale(0.97); }
  .clue-cell.used {
    background: var(--used);
    color: transparent;
    text-shadow: none;
    cursor: default;
    pointer-events: none;
  }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
    animation: fadeIn 0.25s ease-out;
  }
  .modal-backdrop.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--jeopardy-blue);
    border: 6px solid var(--jeopardy-gold);
    border-radius: 12px;
    max-width: 900px;
    width: 100%;
    padding: 36px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    text-align: center;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-category {
    font-family: 'Impact', sans-serif;
    text-transform: uppercase;
    color: var(--jeopardy-gold);
    font-size: 1.1em;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .modal-value {
    font-family: 'Impact', sans-serif;
    color: var(--jeopardy-gold);
    font-size: 1.6em;
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 24px;
  }
  .modal-prompt {
    font-family: 'Helvetica Neue', sans-serif;
    font-size: clamp(1.4em, 2.6vw, 2em);
    color: white;
    text-shadow: 2px 2px 0 #000;
    line-height: 1.4;
    margin: 24px 0;
    padding: 0 12px;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-hint {
    background: rgba(0,0,0,0.3);
    border-left: 4px solid var(--jeopardy-gold);
    padding: 14px 20px;
    margin: 18px 0;
    text-align: left;
    border-radius: 4px;
    color: var(--jeopardy-cream);
    font-size: 1.05em;
    font-style: italic;
    display: none;
  }
  .modal-hint.show { display: block; }
  .modal-hint .hint-label {
    color: var(--jeopardy-gold);
    font-weight: bold;
    font-style: normal;
    margin-right: 8px;
  }
  .modal-answer {
    background: rgba(255,204,0,0.12);
    border: 2px solid var(--jeopardy-gold);
    border-radius: 8px;
    padding: 18px 22px;
    margin: 22px 0;
    display: none;
    animation: revealPop 0.4s ease-out;
  }
  .modal-answer.show { display: block; }
  @keyframes revealPop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .answer-ref {
    font-family: 'Impact', sans-serif;
    color: var(--jeopardy-gold);
    font-size: 1.4em;
    text-shadow: 1px 1px 0 #000;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .answer-phrase {
    color: white;
    font-size: 1.15em;
    line-height: 1.5;
    font-style: italic;
  }

  .modal-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 22px;
  }
  .modal-buttons button {
    padding: 12px 22px;
    font-size: 1em;
    font-family: 'Helvetica Neue', sans-serif;
    font-weight: bold;
    border: 2px solid var(--jeopardy-gold);
    border-radius: 6px;
    background: var(--jeopardy-blue-dark);
    color: var(--jeopardy-gold);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal-buttons button:hover {
    background: var(--jeopardy-gold);
    color: var(--jeopardy-blue-dark);
    transform: translateY(-2px);
  }
  .modal-buttons button:active { transform: translateY(0); }
  .modal-buttons button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .modal-buttons button.award {
    background: rgba(76, 175, 80, 0.2);
    border-color: #6abf6e;
    color: #aef0b1;
  }
  .modal-buttons button.award:hover {
    background: #6abf6e;
    color: #000;
  }
  .modal-buttons button.skip {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.3);
    color: #ccc;
  }

  /* ============ DAILY DOUBLE SPLASH ============ */
  .dd-splash {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .dd-splash.show { display: block; animation: ddPop 0.6s ease-out; }
  @keyframes ddPop {
    0% { transform: scale(0.5) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

    font-family: 'Impact', sans-serif;
    font-size: clamp(2.5em, 6vw, 4.5em);

    margin-bottom: 20px;
  }
  .dd-splash p {
    color: white;

  footer {
    text-align: center;
    margin-top: 8px;
    color: rgba(255,255,255,0.5);

    flex-shrink: 0;

    color: rgba(255,255,255,0.7);

    border-radius: 4px;

    font-family: inherit;

  .audio-panel button {
    background: none;
    border: none;
    color: white;
    font-size: 1.3em;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 50%;
    transition: background 0.15s;
    line-height: 1;
  }
  .audio-panel button:hover { background: rgba(255,255,255,0.15); }
  .audio-panel input[type="range"] {
    width: 90px;
    accent-color: var(--jeopardy-gold);
    cursor: pointer;
  }

    font-size: 0.78em;
    color: rgba(255,255,255,0.75);
    font-family: 'Helvetica Neue', sans-serif;
    margin-left: 4px;
    min-width: 88px;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
</style>
</head>

// ============================================================
// STATE
// ============================================================
const used = new Set(); // "catIdx-clueIdx"
const scores = [0, 0];
let currentClue = null;
let currentCatIdx = -1;
let currentClueIdx = -1;
let hintsShown = 0;

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function beep(freq, duration, type = 'sine', volume = 0.04) {
  if (muted) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) { /* ignore */ }
}

const sfx = {
  click:   () => beep(700, 0.04, 'square', 0.025),
  cell:    () => beep(900, 0.07, 'sine',   0.04),
  hint:    () => beep(500, 0.06, 'triangle', 0.035),
  reveal:  () => { beep(800, 0.08); setTimeout(() => beep(1200, 0.12, 'sine', 0.05), 90); },
  award:   () => { beep(700, 0.07); setTimeout(() => beep(1000, 0.07), 80); setTimeout(() => beep(1400, 0.12), 160); },
  dailyDouble: () => {
    [400, 550, 700, 900, 1100, 1300].forEach((f, i) =>

// ============================================================

//   Picks a random one per clue, never the same one twice in a row.
//   Missing files are silently dropped from the rotation.
// ============================================================
const THEME_FILES = [
  { src: 'audio/garden_of_eden_jeopardy.mp3',         label: '🌳 Eden' },
  { src: 'audio/flight_from_egypt_jeopardy_music.mp3', label: '🏃 Egypt' },

  { src: 'audio/underwater_jeopardy_music.mp3',        label: '🌊 Underwater' }
];

const themes = THEME_FILES.map(({ src, label }) => {
  const a = new Audio(src);
  a.loop = true;
  a._available = true; // optimistic — flipped to false on error
  a._label = label;
  a.addEventListener('error', () => { a._available = false; });
  return a;
});

let currentVolume = 0.45;
let currentTheme = null;
let lastThemeIdx = -1;

function setVolume(v) {
  currentVolume = v;
  themes.forEach(a => { a.volume = v; });
  if (currentTheme) currentTheme.volume = v;
}

function pickTheme() {
  const available = themes
    .map((a, i) => ({ a, i }))
    .filter(({ a }) => a._available);
  if (available.length === 0) return null;
  if (available.length === 1) return available[0].i;
  const candidates = available.filter(({ i }) => i !== lastThemeIdx);
  const pool = candidates.length > 0 ? candidates : available;
  return pool[Math.floor(Math.random() * pool.length)].i;
}

function playTheme() {
  if (muted) return;
  stopTheme();
  const idx = pickTheme();
  if (idx === null) {
    document.getElementById('now-playing').textContent = '';
    return;
  }
  currentTheme = themes[idx];
  lastThemeIdx = idx;
  currentTheme.volume = currentVolume;
  currentTheme.currentTime = 0;
  const playPromise = currentTheme.play();
  if (playPromise) {
    playPromise
      .then(() => {
        document.getElementById('now-playing').textContent = currentTheme._label || '';
      })
      .catch(() => {
        // Failed to play — mark unavailable so we don't pick it again
        currentTheme._available = false;
        document.getElementById('now-playing').textContent = '';
      });
  }
}

function stopTheme() {
  if (currentTheme) {
    try { currentTheme.pause(); } catch (e) {}
  }
  document.getElementById('now-playing').textContent = '';
}

function toggleMute() {
  muted = !muted;
  document.getElementById('audio-toggle').textContent = muted ? '🔇' : '🔊';
  if (muted) {
    stopTheme();
  }
  sfx.click();
}

// ============================================================
// BOARD RENDERING
// ============================================================
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  // Category headers
  BOARD.categories.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'category';
    el.textContent = cat.name;
    board.appendChild(el);
  });

  // Clue cells (5 rows × 5 cols)
  for (let row = 0; row < 5; row++) {
    BOARD.categories.forEach((cat, catIdx) => {
      const clue = cat.clues[row];
      const cell = document.createElement('div');
      cell.className = 'clue-cell';
      cell.textContent = '$' + clue.value;
      const key = `${catIdx}-${row}`;
      if (used.has(key)) {
        cell.classList.add('used');
      }
      cell.addEventListener('click', () => openClue(catIdx, row));
      board.appendChild(cell);
    });
  }
}

// ============================================================
// CLUE MODAL
// ============================================================
function openClue(catIdx, clueIdx) {
  const cat = BOARD.categories[catIdx];
  const clue = cat.clues[clueIdx];
  currentClue = clue;
  currentCatIdx = catIdx;
  currentClueIdx = clueIdx;
  hintsShown = 0;

  sfx.cell();

  // Reset state
  document.getElementById('modal-hint').classList.remove('show');
  document.getElementById('modal-hint').innerHTML = '';
  document.getElementById('modal-answer').classList.remove('show');
  document.getElementById('clue-content').style.display = 'block';
  document.getElementById('dd-splash').classList.remove('show');

  // Daily double — show splash first
  if (clue.type === 'dailyDouble') {
    document.getElementById('clue-content').style.display = 'none';
    document.getElementById('dd-splash').classList.add('show');
    document.getElementById('modal-backdrop').classList.add('show');
    sfx.dailyDouble();
    return;
  }

  // Normal clue
  document.getElementById('modal-category').textContent = cat.name;
  document.getElementById('modal-value').textContent = '$' + clue.value;
  document.getElementById('modal-prompt').textContent = clue.prompt;

  buildButtons(false);
  document.getElementById('modal-backdrop').classList.add('show');
  playTheme();
}

function revealDailyDouble() {
  const clue = currentClue;
  const cat = BOARD.categories[currentCatIdx];
  document.getElementById('dd-splash').classList.remove('show');
  document.getElementById('clue-content').style.display = 'block';
  document.getElementById('modal-category').textContent = cat.name;
  document.getElementById('modal-value').textContent = 'DAILY DOUBLE';
  document.getElementById('modal-prompt').textContent = clue.prompt;
  // For DD, hide hint button — there is no scripture key phrase to hint at.
  buildButtons(true);
  playTheme();
}

function buildButtons(isDailyDouble) {
  const btns = document.getElementById('modal-buttons');
  btns.innerHTML = '';

  if (!isDailyDouble) {
    const hintBtn = document.createElement('button');
    hintBtn.id = 'btn-hint';
    hintBtn.textContent = 'Hint (0/2)';
    hintBtn.onclick = showHint;
    btns.appendChild(hintBtn);
  }

  const revealBtn = document.createElement('button');
  revealBtn.id = 'btn-reveal';
  revealBtn.textContent = 'Reveal Answer';
  revealBtn.onclick = revealAnswer;
  btns.appendChild(revealBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'skip';
  closeBtn.textContent = 'Skip / Close';
  closeBtn.onclick = () => closeClue(false);
  btns.appendChild(closeBtn);
}

function showHint() {
  if (!currentClue || currentClue.type === 'dailyDouble') return;
  if (hintsShown >= 2) return;
  hintsShown++;
  sfx.hint();

  const hintEl = document.getElementById('modal-hint');
  let html = '';

  if (hintsShown === 1) {
    // First hint: partial key phrase (~first 35% of words)
    const phrase = currentClue.keyPhrase;
    const words = phrase.split(/\s+/);
    const showCount = Math.max(2, Math.ceil(words.length * 0.35));
    const partial = words.slice(0, showCount).join(' ');
    html = `<span class="hint-label">Hint 1:</span> "${partial} …"`;
  } else if (hintsShown === 2) {
    // Second hint: book of scripture
    const phrase = currentClue.keyPhrase;
    const words = phrase.split(/\s+/);
    const showCount = Math.max(2, Math.ceil(words.length * 0.35));
    const partial = words.slice(0, showCount).join(' ');
    html =
      `<div><span class="hint-label">Hint 1:</span> "${partial} …"</div>` +
      `<div style="margin-top:8px;"><span class="hint-label">Hint 2:</span> It's from <strong>${currentClue.book}</strong>.</div>`;
  }

  hintEl.innerHTML = html;
  hintEl.classList.add('show');

  // Update button label
  const hintBtn = document.getElementById('btn-hint');
  if (hintBtn) {
    hintBtn.textContent = `Hint (${hintsShown}/2)`;
    if (hintsShown >= 2) hintBtn.disabled = true;
  }
}

function revealAnswer() {
  if (!currentClue) return;
  sfx.reveal();
  stopTheme();

  const ansEl = document.getElementById('modal-answer');
  if (currentClue.type === 'dailyDouble') {
    document.getElementById('answer-ref').textContent = "BROTHER WOOD'S ANALOGY";
    document.getElementById('answer-phrase').textContent = currentClue.answer;
  } else {
    document.getElementById('answer-ref').textContent = currentClue.reference;
    document.getElementById('answer-phrase').textContent = currentClue.keyPhrase;
  }
  ansEl.classList.add('show');

  // After reveal, swap the buttons to award buttons
  const btns = document.getElementById('modal-buttons');
  btns.innerHTML = '';
  const value = currentClue.value;

  const t1 = document.createElement('button');
  t1.className = 'award';
  t1.textContent = `${getTeamName(0)} +$${value}`;
  t1.onclick = () => awardAndClose(0, value);
  btns.appendChild(t1);

  const t2 = document.createElement('button');
  t2.className = 'award';
  t2.textContent = `${getTeamName(1)} +$${value}`;
  t2.onclick = () => awardAndClose(1, value);
  btns.appendChild(t2);

  const skip = document.createElement('button');
  skip.className = 'skip';
  skip.textContent = 'No One — Close';
  skip.onclick = () => closeClue(true);
  btns.appendChild(skip);
}

function getTeamName(idx) {
  return document.querySelectorAll('.team-name')[idx].textContent.trim() || `Team ${idx+1}`;
}

function awardAndClose(teamIdx, value) {
  scores[teamIdx] += value;
  updateScores();
  sfx.award();
  closeClue(true);
}

function closeClue(markUsed) {
  stopTheme();
  document.getElementById('modal-backdrop').classList.remove('show');
  if (markUsed && currentCatIdx >= 0 && currentClueIdx >= 0) {
    used.add(`${currentCatIdx}-${currentClueIdx}`);
    renderBoard();
  }
  currentClue = null;
  currentCatIdx = -1;
  currentClueIdx = -1;
  hintsShown = 0;
}

// ============================================================
// SCORES
// ============================================================
function updateScores() {
  for (let i = 0; i < 2; i++) {
    const el = document.getElementById('score-' + (i + 1));
    const val = scores[i];
    el.textContent = (val < 0 ? '−$' : '$') + Math.abs(val);
    el.classList.toggle('negative', val < 0);
  }
}

function adjustScore(teamIdx, delta) {
  scores[teamIdx] += delta;
  updateScores();
  sfx.click();
}

function resetGame() {
  if (!confirm('Reset the whole game? (Scores and used clues will be cleared.)')) return;
  used.clear();
  scores[0] = 0;
  scores[1] = 0;
  updateScores();
  renderBoard();
  sfx.click();
}

// ============================================================
// KEYBOARD: Esc to close modal
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('modal-backdrop').classList.contains('show')) {
    closeClue(false);
  }
});

// ============================================================
// INIT
// ============================================================
renderBoard();
updateScores();
</script>
</body>
</html>
